name: CI - Format Check

on:
  pull_request:
  push:
    # main은 CD 워크플로가 이 워크플로를 호출해 배포 전에 검증한다.
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
  workflow_call:

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Check format
        run: ./gradlew checkFormat
