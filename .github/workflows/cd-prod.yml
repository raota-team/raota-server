name: CD - Deploy to Prod (Self-hosted Swarm)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]  # 프라이빗 매니저에서 직접 실행

    environment:
      name: raota-prod-server
    concurrency:
      group: raota-prod-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 서버 메모리가 넉넉하므로 빌드는 서버에서 직접 수행 (또는 기존처럼 이미지 빌드 후 땡겨오기)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar (without tests)
        run: ./gradlew clean bootJar -x test

      - name: Docker login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ secrets.OCIR_REGISTRY }}" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build and Deploy (Local Build)
        env:
          IMAGE_URI: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          OCI_VAULT_ID: "ocid1.vault.oc1.ap-chuncheon-1.gju25j3taaark.ab4w4ljrvayyfb3dk5dp2yu45i7aw5u6jvjl73tfjxaqfxgexq3do6izft5szq"
        run: |
          # 1. 이미지 빌드 (서버에서 직접 하므로 아키텍처 불일치 걱정 없음)
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" .
          
          # 2. 레지스트리에 푸시 (워커 노드 전파용)
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

          # 3. 로컬에서 바로 스택 배포
          export IMAGE_URI IMAGE_TAG OCI_VAULT_ID
          docker stack deploy --with-registry-auth -c docker-stack.yml raota

          # 4. 배포 상태 모니터링 고도화
          service_name="raota_app"
          echo "[swarm] Monitoring deployment for ${service_name}..."
          
          # 최대 60번 시도 (10초 간격 = 총 10분)
          for attempt in $(seq 1 60); do
            # 현재 가동 중인 레플리카 수와 상태 요약 가져오기 (더 안정적인 방식)
            replicas_running=$(docker service ps ${service_name} --filter "desired-state=running" --format "{{.CurrentState}}" | grep -c "Running" || echo "0")
            replicas_total=$(docker service inspect ${service_name} --format "{{.Spec.Mode.Replicated.Replicas}}")
            replicas_status="${replicas_running}/${replicas_total}"
            
            update_state=$(docker service inspect "$service_name" --format "{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}")
            
            # 각 태스크(컨테이너)의 상세 상태 한 줄로 요약
            task_states=$(docker service ps ${service_name} --filter "desired-state=running" --format "{{.CurrentState}}" | tr '\n' ',' | sed 's/,$//')
            
            echo "[swarm] Attempt ${attempt}: Replicas [${replicas_status}] | Update: ${update_state} | Tasks: [${task_states}]"

            if [[ "$update_state" == "completed" || "$update_state" == "" ]]; then
              if [[ "$replicas_running" -ge "$replicas_total" ]]; then
                echo "🚀 [swarm] Deployment successful! All ${replicas_total} replicas are running."
                exit 0
              fi
            elif [[ "$update_state" == "failed" || "$update_state" == "rollback_started" ]]; then
              echo "❌ [swarm] Deployment failed or rolling back!"
              echo "--- Last Error Logs ---"
              docker service ps ${service_name} --no-trunc --filter "desired-state=shutdown" | head -n 5
              exit 1
            fi
            
            # 만약 태스크 중에 Error가 있다면 상세 정보 출력
            if [[ "$task_states" == *"Error"* || "$task_states" == *"Failed"* ]]; then
               echo "⚠️ [swarm] Warning: Some tasks are failing. Checking errors..."
               docker service ps ${service_name} --no-trunc | grep -E "Error|Failed" | head -n 3
            fi

            sleep 10
          done

          echo "⌛ [swarm] Deployment timed out after 10 minutes."
          exit 1
