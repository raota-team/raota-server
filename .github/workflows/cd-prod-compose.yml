name: CD - Build Image and Dispatch Prod Deploy

on:
  push:
    branches:
      - main
    # 문서만 바뀐 푸시는 이미지 빌드·운영 배포를 건너뛴다.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  # format-check·test·build-image는 동시에 실행되고, 셋 다 성공해야 deploy가 latest 태그를 붙이고 운영 배포를 요청한다.
  format-check:
    uses: ./.github/workflows/format-check.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-image:
    runs-on: [self-hosted, linux, arm64]

    environment:
      name: raota-prod-server
    concurrency:
      group: raota-prod-image-build
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar (tests run in the test job)
        run: ./gradlew clean bootJar -x test

      - name: Docker login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ secrets.OCIR_REGISTRY }}" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      # self-hosted 러너는 커밋마다 만든 이미지가 쌓여 디스크가 찬다. 운영 중인 latest만 남기고(다음 빌드의 레이어 캐시)
      # 이 저장소의 예전 커밋 이미지와 이름 없는 중간 이미지를 지운다. 다른 저장소 이미지와 실행 중인 컨테이너의 이미지는 건드리지 않는다.
      - name: Remove old commit images
        env:
          IMAGE_URI: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}
        run: |
          df -h /
          docker images "${IMAGE_URI}" --format '{{.Tag}}' | grep -vx 'latest' | while read -r tag; do
            docker rmi "${IMAGE_URI}:${tag}" >/dev/null || true
          done
          docker image prune -f
          df -h /

      - name: Build and push commit image
        env:
          IMAGE_URI: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg GIT_COMMIT="${IMAGE_TAG}" -t "${IMAGE_URI}:${IMAGE_TAG}" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"

  deploy:
    needs: [format-check, test, build-image]
    runs-on: [self-hosted, linux, arm64]

    environment:
      name: raota-prod-server
    concurrency:
      group: raota-prod-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Docker login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ secrets.OCIR_REGISTRY }}" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      # 운영 중이던 latest를 previous로 남긴 뒤 latest를 옮긴다. previous는 롤백 대상이고, 아래 레지스트리 정리에서 지우지 않는다.
      - name: Tag verified image as latest
        env:
          IMAGE_URI: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull "${IMAGE_URI}:${IMAGE_TAG}"
          if docker pull "${IMAGE_URI}:latest"; then
            current_id="$(docker image inspect -f '{{.Id}}' "${IMAGE_URI}:latest")"
            new_id="$(docker image inspect -f '{{.Id}}' "${IMAGE_URI}:${IMAGE_TAG}")"
            # 같은 커밋을 다시 배포하면 previous를 덮어쓰지 않는다.
            if [[ "${current_id}" != "${new_id}" ]]; then
              docker tag "${IMAGE_URI}:latest" "${IMAGE_URI}:previous"
              docker push "${IMAGE_URI}:previous"
            fi
          fi
          docker tag "${IMAGE_URI}:${IMAGE_TAG}" "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:latest"

      - name: Dispatch infra deploy workflow
        id: dispatch-infra-deploy
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          dispatched_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          payload="$(printf '{"ref":"main","inputs":{"image_tag":"%s"}}' "${IMAGE_TAG}")"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raota-team/raota-infra/actions/workflows/deploy-prod-compose.yml/dispatches \
            -d "${payload}"

          echo "dispatched_at=${dispatched_at}" >> "$GITHUB_OUTPUT"

      - name: Wait for infra deploy workflow
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          DISPATCHED_AT: ${{ steps.dispatch-infra-deploy.outputs.dispatched_at }}
          INFRA_REPOSITORY: raota-team/raota-infra
          INFRA_WORKFLOW_FILE: deploy-prod-compose.yml
          WAIT_TIMEOUT_SECONDS: 1800
          POLL_INTERVAL_SECONDS: 5
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["INFRA_DISPATCH_TOKEN"]
          repository = os.environ["INFRA_REPOSITORY"]
          workflow_file = os.environ["INFRA_WORKFLOW_FILE"]
          dispatched_at = datetime.datetime.fromisoformat(
              os.environ["DISPATCHED_AT"].replace("Z", "+00:00")
          )
          timeout_seconds = int(os.environ["WAIT_TIMEOUT_SECONDS"])
          poll_interval_seconds = int(os.environ["POLL_INTERVAL_SECONDS"])
          deadline = time.monotonic() + timeout_seconds
          run_id = None

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API request failed: {error.code} {body}") from error

          def parse_created_at(run):
              return datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))

          runs_url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{urllib.parse.quote(workflow_file)}/runs"
              "?event=workflow_dispatch&branch=main&per_page=20"
          )

          while time.monotonic() < deadline and run_id is None:
              data = request_json(runs_url)
              candidates = [
                  run for run in data.get("workflow_runs", [])
                  if parse_created_at(run) >= dispatched_at
              ]
              if candidates:
                  candidates.sort(key=parse_created_at)
                  run_id = candidates[0]["id"]
                  print(f"Found infra deploy workflow run: {candidates[0]['html_url']}", flush=True)
                  break

              print("Waiting for infra deploy workflow run to be created...", flush=True)
              time.sleep(poll_interval_seconds)

          if run_id is None:
              raise TimeoutError("Timed out waiting for infra deploy workflow run to be created.")

          run_url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
          while time.monotonic() < deadline:
              run = request_json(run_url)
              status = run.get("status")
              conclusion = run.get("conclusion")
              html_url = run.get("html_url")

              print(f"Infra deploy status: status={status}, conclusion={conclusion}, url={html_url}", flush=True)

              if status == "completed":
                  if conclusion == "success":
                      sys.exit(0)
                  raise RuntimeError(f"Infra deploy workflow failed with conclusion={conclusion}: {html_url}")

              time.sleep(poll_interval_seconds)

          raise TimeoutError("Timed out waiting for infra deploy workflow to complete.")
          PY

      # 배포가 끝난 뒤 OCIR에는 latest(운영 중)와 previous(롤백 대상)만 남긴다. OCIR 자체 보존 정책은 일수 기준이라
      # "최근 N개"를 지정할 수 없어 직접 지운다. 러너(spring_1)의 instance principal에 repos 관리 권한이 필요하다(raota-infra iam.tf).
      - name: Remove old registry images
        env:
          OCI_CLI_AUTH: instance_principal
          OCIR_COMPARTMENT_ID: ocid1.tenancy.oc1..aaaaaaaamunwqadhaq2kcjn4ygihnhaaat2dvc2plliklmqzfhaf27sqlsbq
          OCIR_REPOSITORY: ${{ secrets.OCIR_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          oci="${HOME}/bin/oci"
          list() {
            "${oci}" artifacts container image list --compartment-id "${OCIR_COMPARTMENT_ID}" \
              --repository-name "${OCIR_REPOSITORY}" --all --raw-output --query "$1"
          }
          # 태그마다 한 줄이 나오고, 같은 이미지(digest)의 태그는 같은 id를 가진다.
          keep="$(list "join(' ', data.items[?version=='latest' || version=='previous'].id)" | tr ' ' '\n' | sort -u)"
          if [[ -z "${keep}" ]]; then
            echo "latest image not found in ${OCIR_REPOSITORY}; skip cleanup" >&2
            exit 1
          fi
          all="$(list "join(' ', data.items[].id)" | tr ' ' '\n' | sort -u)"
          stale="$(comm -23 <(printf '%s\n' "${all}") <(printf '%s\n' "${keep}"))"
          echo "keep $(printf '%s\n' "${keep}" | wc -l) image(s), delete $(printf '%s' "${stale}" | grep -c . || true) image(s)"
          if [[ -n "${stale}" ]]; then
            printf '%s\n' "${stale}" | xargs -P 4 -I{} "${oci}" artifacts container image delete --image-id {} --force
          fi
