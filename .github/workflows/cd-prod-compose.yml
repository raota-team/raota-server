name: CD - Build Image and Dispatch Prod Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Deploy scope
        required: true
        type: choice
        default: canary
        options:
          - canary
          - full
      canary_host:
        description: Canary target host
        required: true
        type: choice
        default: 10.0.1.213
        options:
          - 10.0.1.213
          - 10.0.1.144
          - 10.0.1.87

jobs:
  build-and-dispatch:
    runs-on: [self-hosted, linux, arm64]

    environment:
      name: raota-prod-server
    concurrency:
      group: raota-prod-image-build
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar (without tests)
        run: ./gradlew clean bootJar -x test

      - name: Docker login to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ secrets.OCIR_REGISTRY }}" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build and push image
        env:
          IMAGE_URI: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Resolve deploy inputs
        id: deploy-inputs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_mode=${{ inputs.deploy_mode }}" >> "$GITHUB_OUTPUT"
            echo "canary_host=${{ inputs.canary_host }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_mode=full" >> "$GITHUB_OUTPUT"
            echo "canary_host=10.0.1.213" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch infra deploy workflow
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_MODE: ${{ steps.deploy-inputs.outputs.deploy_mode }}
          CANARY_HOST: ${{ steps.deploy-inputs.outputs.canary_host }}
        shell: bash
        run: |
          set -euo pipefail

          payload="$(printf '{"ref":"main","inputs":{"image_tag":"%s","deploy_mode":"%s","canary_host":"%s"}}' "${IMAGE_TAG}" "${DEPLOY_MODE}" "${CANARY_HOST}")"

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/raota-team/raota-infra/actions/workflows/deploy-prod-compose.yml/dispatches \
            -d "${payload}"
