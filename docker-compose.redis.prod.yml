services:
  redis:
    container_name: raota-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1536mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - raota-redis-data:/data

volumes:
  raota-redis-data:
