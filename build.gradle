plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'raota'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '2.0.0'
    springModulithVersion = '2.1.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

dependencies {

    /*
     * Spring Boot
     */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /*
     * Persistence
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

    /*
     * Flyway
     */
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    /*
     * Security / OAuth2
     */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /*
     * JWT
     */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    /*
     * Redis / Cache
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    /*
     * Monitoring
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    /*
     * OpenAPI / Swagger
     */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    /*
     * Spring Modulith
     */
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    /*
     * Spring AI
     */
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-oracle'

    /*
     * File / Cloud
     */
    implementation 'software.amazon.awssdk:s3:2.42.8'
    implementation 'com.oracle.oci.sdk:oci-java-sdk-shaded-full:3.63.1'
    implementation 'com.cloudinary:cloudinary-http5:2.0.0'

    /*
     * Lombok
     *
     * Spring Boot BOM이 Lombok 버전을 관리하므로
     * 직접 버전을 지정하지 않는다.
     */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    /*
     * Test
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testImplementation 'io.rest-assured:rest-assured:6.0.0'

    /*
     * Spring Modulith Test
     */
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    /*
     * Testcontainers
     *
     * Spring Boot 4.1.0 BOM이 Testcontainers 2.0.5를 관리한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'

    /*
     * Redis Testcontainers
     *
     * Spring Boot BOM 관리 대상이 아니므로 버전 명시.
     */
    testImplementation 'com.redis:testcontainers-redis:2.2.4'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}