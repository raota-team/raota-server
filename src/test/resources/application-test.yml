# 테스트용 프로필: Testcontainers MySQL
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 1000

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  auth:
    issuer: raota-test
    access-token-secret: test-raota-access-token-secret-key-1234567890
    access-token-expiry-seconds: 1800
    refresh-token-expiry-seconds: 1209600
    refresh-token:
      store-type: jpa
    oauth2:
      redirect-uri: http://localhost:3000/auth/callback
      failure-redirect-uri: http://localhost:3000/auth/callback
    cookie:
      refresh-token-name: raota_refresh_token
      secure: false
      same-site: Lax
      domain:
    cors:
      allowed-origins:
        - http://localhost:3000

cloudinary:
  cloud-name: test-cloud-name
  api-key: test-api-key
  api-secret: test-api-secret
