<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 관리</title>
    <style>
        :root {
            --bg: #f6f1e9;
            --panel: #fffdf8;
            --line: #dccdbc;
            --ink: #26170c;
            --muted: #756355;
            --accent: #b33f1d;
            --accent-soft: #f3d1bd;
            --green: #1d6f32;
            --danger: #b42318;
            --shadow: 0 18px 36px rgba(38, 23, 12, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, #efe2cf, #f9f6ef 50%, #ead2bc);
        }

        .shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 20px 44px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        .topbar p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        a {
            color: inherit;
        }

        .nav-link,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid rgba(126, 34, 8, 0.16);
            border-radius: 8px;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.72);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .button.primary {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(126, 34, 8, 0.12);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        form {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) repeat(4, minmax(140px, 180px)) auto auto;
            gap: 10px;
            padding: 18px;
            border-bottom: 1px solid rgba(126, 34, 8, 0.1);
        }

        input,
        select {
            width: 100%;
            min-height: 40px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: #fff;
            font: inherit;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1060px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 14px;
            border-bottom: 1px solid rgba(126, 34, 8, 0.08);
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: rgba(126, 34, 8, 0.04);
            font-size: 0.86rem;
        }

        tr:hover td {
            background: rgba(240, 199, 177, 0.18);
        }

        .muted {
            color: var(--muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .badge.ok {
            color: var(--green);
            background: rgba(29, 111, 50, 0.12);
        }

        .badge.pending {
            color: var(--accent);
            background: rgba(179, 63, 29, 0.12);
        }

        .badge.deleted {
            color: var(--danger);
            background: rgba(180, 35, 24, 0.1);
        }

        .empty {
            padding: 28px;
            color: var(--muted);
            text-align: center;
        }

        .pager {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
        }

        .pager-actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 1180px) {
            form {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .topbar {
                align-items: start;
                flex-direction: column;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div>
            <h1>유저 관리</h1>
            <p th:text="|총 ${users.totalElements}명|">총 0명</p>
        </div>
        <div>
            <a class="nav-link" th:href="@{/admin}">어드민 홈</a>
            <a class="nav-link" th:href="@{/admin/ramen-shops}">라멘집 관리</a>
        </div>
    </header>

    <section class="panel">
        <form method="get" th:action="@{/admin/users}">
            <input type="search" name="keyword" placeholder="닉네임, 이메일, 회원 ID" th:value="${keyword}">
            <select name="registrationCompleted">
                <option value="" th:selected="${registrationCompleted == null}">가입 전체</option>
                <option value="true" th:selected="${registrationCompleted == true}">가입 완료</option>
                <option value="false" th:selected="${registrationCompleted == false}">가입 미완료</option>
            </select>
            <select name="deleted">
                <option value="" th:selected="${deleted == null}">탈퇴 전체</option>
                <option value="false" th:selected="${deleted == false}">활성 회원</option>
                <option value="true" th:selected="${deleted == true}">탈퇴 회원</option>
            </select>
            <select name="provider">
                <option value="" th:selected="${provider == null}">소셜 전체</option>
                <option th:each="item : ${providers}"
                        th:value="${item.name()}"
                        th:text="${item.name()}"
                        th:selected="${provider == item}">GOOGLE</option>
            </select>
            <select name="emailPresent">
                <option value="" th:selected="${emailPresent == null}">이메일 전체</option>
                <option value="true" th:selected="${emailPresent == true}">이메일 있음</option>
                <option value="false" th:selected="${emailPresent == false}">이메일 없음</option>
            </select>
            <button class="button primary" type="submit">검색</button>
            <a class="button" th:href="@{/admin/users}">초기화</a>
        </form>

        <div class="table-wrap" th:if="${!users.empty}">
            <table>
                <thead>
                <tr>
                    <th>회원 ID</th>
                    <th>닉네임</th>
                    <th>이메일</th>
                    <th>소셜 제공자</th>
                    <th>가입일</th>
                    <th>최근 수정일</th>
                    <th>가입 상태</th>
                    <th>탈퇴 여부</th>
                    <th>상세</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.memberId()}">1</td>
                    <td th:text="${user.nickname()}">닉네임</td>
                    <td th:text="${user.email() ?: '-'}">email@example.com</td>
                    <td th:text="${user.providers()}">KAKAO</td>
                    <td th:text="${#temporals.format(user.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                    <td th:text="${#temporals.format(user.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                    <td>
                        <span class="badge ok" th:if="${user.registrationCompleted()}">완료</span>
                        <span class="badge pending" th:unless="${user.registrationCompleted()}">미완료</span>
                    </td>
                    <td>
                        <span class="badge deleted" th:if="${user.deleted()}">탈퇴</span>
                        <span class="badge ok" th:unless="${user.deleted()}">활성</span>
                    </td>
                    <td>
                        <a class="nav-link" th:href="@{/admin/users/{id}(id=${user.memberId()})}">보기</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${users.empty}">조건에 맞는 유저가 없습니다.</div>

        <div class="pager">
            <span class="muted" th:text="|${users.number + 1} / ${users.totalPages == 0 ? 1 : users.totalPages} 페이지|">1 / 1 페이지</span>
            <div class="pager-actions">
                <a class="button"
                   th:if="${users.hasPrevious()}"
                   th:href="@{/admin/users(keyword=${keyword}, registrationCompleted=${registrationCompleted}, deleted=${deleted}, provider=${provider}, emailPresent=${emailPresent}, page=${users.number - 1}, size=${users.size})}">이전</a>
                <a class="button"
                   th:if="${users.hasNext()}"
                   th:href="@{/admin/users(keyword=${keyword}, registrationCompleted=${registrationCompleted}, deleted=${deleted}, provider=${provider}, emailPresent=${emailPresent}, page=${users.number + 1}, size=${users.size})}">다음</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
