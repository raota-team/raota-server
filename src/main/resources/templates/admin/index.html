<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라오타 어드민</title>
    <style>
        :root {
            --bg: #f6f1e9;
            --panel: #fffdf8;
            --line: #dccdbc;
            --ink: #26170c;
            --muted: #756355;
            --accent: #b33f1d;
            --accent-soft: #f3d1bd;
            --green: #1d6f32;
            --shadow: 0 18px 36px rgba(38, 23, 12, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, #efe2cf, #f9f6ef 50%, #ead2bc);
        }

        .shell {
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        .header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 2.4rem;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: 24px;
            color: inherit;
            text-decoration: none;
            background: var(--panel);
            border: 1px solid rgba(126, 34, 8, 0.12);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .card:hover {
            border-color: rgba(179, 63, 29, 0.42);
        }

        .card span {
            width: fit-content;
            padding: 7px 10px;
            border-radius: 999px;
            color: var(--accent);
            background: var(--accent-soft);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .card h2 {
            margin: 28px 0 8px;
            font-size: 1.45rem;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .card strong {
            margin-top: auto;
            color: var(--accent);
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main class="shell">
    <div class="header">
        <h1>라오타 어드민</h1>
        <p>운영 데이터를 확인하고 관리할 영역을 선택하세요.</p>
    </div>

    <section class="grid">
        <a class="card" th:href="@{/admin/ramen-shops}">
            <span>SHOP</span>
            <h2>라멘집 관리</h2>
            <p>라멘집 기본 정보, 메뉴, 공개 여부를 관리합니다.</p>
            <strong>이동</strong>
        </a>
        <a class="card" th:href="@{/admin/ramen-shop-reports}">
            <span>REPORT</span>
            <h2>라멘집 제보</h2>
            <p>영업시간 오류, 폐업, 메뉴 정보 오류 등 유저 제보를 확인합니다.</p>
            <strong>이동</strong>
        </a>
        <a class="card" th:href="@{/admin/users}">
            <span>USER</span>
            <h2>유저 관리</h2>
            <p>회원 프로필, 소셜 계정, 활동 통계, 공개 범위를 조회합니다.</p>
            <strong>이동</strong>
        </a>
    </section>
</main>
</body>
</html>
