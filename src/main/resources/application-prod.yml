oci:
  vault:
    enabled: true
    region: ap-chuncheon-1
    vault-id: ocid1.vault.oc1.ap-chuncheon-1.gju25j3taaark.ab4w4ljrvayyfb3dk5dp2yu45i7aw5u6jvl73tfjxaqfxgeq3do6izft5szq
  storage:
    namespace: ${OCI_STORAGE_NAMESPACE:}
    bucket: ${OCI_STORAGE_BUCKET:}
    region: ${OCI_STORAGE_REGION:}
    access-key: ${OCI_STORAGE_ACCESS_KEY:}
    secret-key: ${OCI_STORAGE_SECRET_KEY:}

server:
  port: 8080
  shutdown: graceful

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  auth:
    issuer: raota
    access-token-secret: ${APP_AUTH_ACCESS_TOKEN_SECRET}
    access-token-expiry-seconds: ${APP_AUTH_ACCESS_TOKEN_EXPIRY_SECONDS:1800}
    refresh-token-expiry-seconds: ${APP_AUTH_REFRESH_TOKEN_EXPIRY_SECONDS:1209600}
    refresh-token:
      store-type: ${APP_AUTH_REFRESH_TOKEN_STORE_TYPE:redis}
    oauth2:
      redirect-uri: ${APP_AUTH_OAUTH2_REDIRECT_URI}
      failure-redirect-uri: ${APP_AUTH_OAUTH2_FAILURE_REDIRECT_URI:${APP_AUTH_OAUTH2_REDIRECT_URI}}
    cookie:
      refresh-token-name: ${APP_AUTH_REFRESH_TOKEN_COOKIE_NAME:raota_refresh_token}
      secure: ${APP_AUTH_REFRESH_TOKEN_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
      domain: ${APP_AUTH_REFRESH_TOKEN_COOKIE_DOMAIN:}
    cors:
      allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS:https://www.raota.net,https://raota.net,http://localhost:3000}
