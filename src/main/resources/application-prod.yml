oci:
  storage:
    namespace: ${OCI_STORAGE_NAMESPACE:}
    bucket: ${OCI_STORAGE_BUCKET:}
    region: ${OCI_STORAGE_REGION:}
    access-key: ${OCI_STORAGE_ACCESS_KEY:}
    secret-key: ${OCI_STORAGE_SECRET_KEY:}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

spring:
  modulith:
    detection-strategy: explicitly-annotated
  config:
    # 배포 워크플로(raota-infra)가 OCI Vault 비밀값을 이름별 파일로 받아 이 경로에 마운트한다. 파일 이름이 곧 속성 이름이다.
    import: "optional:configtree:/run/secrets/raota/"
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.oracle.autoconfigure.OracleVectorStoreAutoConfiguration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
              - talk_message
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      chat:
        api-key: ${GROQ_API_KEY}
        base-url: https://api.groq.com/openai/v1
        temperature: ${SPRING_AI_GROQ_CHAT_TEMPERATURE:0.6}
        model: ${SPRING_AI_GROQ_CHAT_MODEL:openai/gpt-oss-120b}
      embedding:
        api-key: ${OPENAI_API_KEY}
        base-url: https://api.openai.com/v1
        model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${SPRING_AI_OPENAI_EMBEDDING_DIMENSIONS:1536}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    io.lettuce.core: ${LOGGING_LEVEL_IO_LETTUCE_CORE:INFO}
    io.lettuce.core.protocol: ${LOGGING_LEVEL_IO_LETTUCE_PROTOCOL:INFO}
    org.springframework.data.redis: ${LOGGING_LEVEL_SPRING_DATA_REDIS:INFO}
    org.springframework.data.redis.connection.lettuce: ${LOGGING_LEVEL_SPRING_DATA_REDIS_LETTUCE:INFO}
    org.springframework.data.redis.stream: ${LOGGING_LEVEL_SPRING_DATA_REDIS_STREAM:INFO}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:none}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

external-api:
  kma:
    auth-key: ${KMA_AUTH_KEY:${KMA_SERVICE_KEY}}
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      enabled: true

app:
  auth:
    issuer: raota
    access-token-secret: ${APP_AUTH_ACCESS_TOKEN_SECRET}
    access-token-expiry-seconds: ${APP_AUTH_ACCESS_TOKEN_EXPIRY_SECONDS:1800}
    refresh-token-expiry-seconds: ${APP_AUTH_REFRESH_TOKEN_EXPIRY_SECONDS:1209600}
    refresh-token:
      store-type: ${APP_AUTH_REFRESH_TOKEN_STORE_TYPE:redis}
    oauth2:
      redirect-uri: ${APP_AUTH_OAUTH2_REDIRECT_URI}
      failure-redirect-uri: ${APP_AUTH_OAUTH2_FAILURE_REDIRECT_URI:${APP_AUTH_OAUTH2_REDIRECT_URI}}
      # 로그인 뒤 access token을 fragment로 실어 보낼 수 있는 출처. CORS 목록(APP_AUTH_ALLOWED_ORIGINS)과 따로 둔다.
      allowed-redirect-origins: https://www.raota.net,https://raota.net
    cookie:
      refresh-token-name: ${APP_AUTH_REFRESH_TOKEN_COOKIE_NAME:raota_refresh_token}
      secure: ${APP_AUTH_REFRESH_TOKEN_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_REFRESH_TOKEN_COOKIE_SAME_SITE:None}
      domain: ${APP_AUTH_REFRESH_TOKEN_COOKIE_DOMAIN:.raota.net}
    cors:
      allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS:https://www.raota.net,https://raota.net,http://localhost:3000}
  mobile:
    upload:
      image-base-url: https://images.raota.net/
    auth:
      issuer: raota-mobile
      access-token-secret: ${APP_MOBILE_AUTH_ACCESS_TOKEN_SECRET}
      access-token-expiry-seconds: 1800
    oauth:
      google:
        # 모바일 앱의 Google 로그인도 v1 웹 OAuth 클라이언트를 webClientId로 쓴다.
        client-ids: ${APP_MOBILE_OAUTH_GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID}}
      kakao:
        # v1 웹과 같은 Kakao 앱(라오타)의 앱 ID. 비밀값이 아니다.
        app-id: ${APP_MOBILE_OAUTH_KAKAO_APP_ID:1422344}
      apple:
        bundle-id: ${APP_MOBILE_OAUTH_APPLE_BUNDLE_ID}
        team-id: ${APP_MOBILE_OAUTH_APPLE_TEAM_ID}
        key-id: ${APP_MOBILE_OAUTH_APPLE_KEY_ID}
        private-key: ${APP_MOBILE_OAUTH_APPLE_PRIVATE_KEY}
        token-encryption-key: ${APP_MOBILE_OAUTH_APPLE_TOKEN_ENCRYPTION_KEY}
    account:
      withdrawal-grace-period: ${APP_MOBILE_ACCOUNT_WITHDRAWAL_GRACE_PERIOD:30d}
      # 회원이 동의해야 하는 약관·처리방침 시행일. 문서를 개정하면 올려서 기존 회원에게 다시 동의를 받는다.
      required-terms-version: ${APP_MOBILE_ACCOUNT_REQUIRED_TERMS_VERSION:2026-11-03}
      required-privacy-version: ${APP_MOBILE_ACCOUNT_REQUIRED_PRIVACY_VERSION:2026-11-03}
  file:
    # 앱이 올렸지만 기록·프로필 어디에도 연결되지 않은 v2 사진을 매일 05:10(KST)에 지운다.
    orphan-cleanup:
      enabled: ${APP_FILE_ORPHAN_CLEANUP_ENABLED:true}
      retention: ${APP_FILE_ORPHAN_CLEANUP_RETENTION:P7D}
      max-deletes: ${APP_FILE_ORPHAN_CLEANUP_MAX_DELETES:500}
  redis:
    auth:
      refresh-token-key-prefix: "${APP_REDIS_AUTH_REFRESH_TOKEN_KEY_PREFIX:auth:refresh:token:}"
      refresh-member-key-prefix: "${APP_REDIS_AUTH_REFRESH_MEMBER_KEY_PREFIX:auth:refresh:member:}"
    cache:
      invalidation-topic: ${APP_REDIS_CACHE_INVALIDATION_TOPIC:cache-invalidation}
      caches:
        ramenShopDetail:
          ttl-seconds: ${APP_CACHE_RAMEN_SHOP_DETAIL_TTL_SECONDS:1800}
          maximum-size: ${APP_CACHE_RAMEN_SHOP_DETAIL_MAX_SIZE:200}
        ramenShopList:
          ttl-seconds: ${APP_CACHE_RAMEN_SHOP_LIST_TTL_SECONDS:300}
          maximum-size: ${APP_CACHE_RAMEN_SHOP_LIST_MAX_SIZE:50}
  rag:
    evaluation:
      vector-index-version: ${APP_RAG_EVALUATION_VECTOR_INDEX_VERSION:oracle-legacy-unversioned}
      model-metadata: '{"chatModel":"${spring.ai.openai.chat.model}","embeddingModel":"${spring.ai.openai.embedding.model}","embeddingDimensions":"${spring.ai.openai.embedding.dimensions}"}'
  ai:
    vector-store:
      enabled: true
    oracle:
      url: ${AI_ORACLE_DATASOURCE_URL}
      username: ${AI_ORACLE_DATASOURCE_USERNAME}
      password: ${AI_ORACLE_DATASOURCE_PASSWORD}
      driver-class-name: ${AI_ORACLE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
      initialize-schema: ${AI_ORACLE_INITIALIZE_SCHEMA:false}
      index-type: ${AI_ORACLE_INDEX_TYPE:NONE}
      distance-type: ${AI_ORACLE_DISTANCE_TYPE:COSINE}
      dimensions: ${AI_ORACLE_DIMENSIONS:1536}
      forced-normalization: ${AI_ORACLE_FORCED_NORMALIZATION:true}
      remove-existing-vector-store-table: ${AI_ORACLE_REMOVE_EXISTING_VECTOR_STORE_TABLE:false}
      search-accuracy: ${AI_ORACLE_SEARCH_ACCURACY:95}
