services:
  app:
    container_name: raota-app
    image: ${APP_IMAGE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms2g -Xmx4g}
      OCI_VAULT_ID: ${OCI_VAULT_ID}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
