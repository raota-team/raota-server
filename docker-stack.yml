version: '3.8'

services:
  app:
    image: ${IMAGE_URI}:${IMAGE_TAG}
    ports:
      - "8080:8080"
    networks:
      - raota-net
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms4g -Xmx4g
      - OCI_VAULT_ID=${OCI_VAULT_ID}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker  # 앱은 워커 노드에서만 실행
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 4G
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - raota-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

networks:
  raota-net:
    driver: overlay
    ipam:
      config:
        - subnet: 10.10.1.0/24
